name: restaurants

services:
  postgres:
    image: postgis/postgis:16-3.4

    container_name: restaurants_postgres

    restart: unless-stopped

    ports:
      # 5432–5438 están ocupados por otros proyectos (ecommerce, CRM, etc.);
      # 5435 se reserva para este proyecto.
      - "5435:5432"

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: restaurants

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d restaurants"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
